<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="gallery-header">
        <h1>Our Featured Products</h1>
        <p>Explore our exclusive collection with modern CSS Grid layouts.</p>
    </header>

    <main class="product-grid-container">

        <div class="product-card">
            <div class="product-image">
                <img src="shoes.jpg" alt="Classic Sneakers">
            </div>
            <div class="product-info">
                <h3>Classic Sneakers</h3>
                <p class="price">Rs.3000</p>
                <button class="buy-btn">Add to Cart</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="watch.jpg" alt="Smart Watch">
            </div>
            <div class="product-info">
                <h3>Smart Watch</h3>
                <p class="price">Rs.1999</p>
                <button class="buy-btn">Add to Cart</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="headphones.jpg" alt="Wireless Headphones">
            </div>
            <div class="product-info">
                <h3>Wireless Headphones</h3>
                <p class="price">Rs.2500</p>
                <button class="buy-btn">Add to Cart</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="bag.jpg" alt="Backpack">
            </div>
            <div class="product-info">
                <h3>Backpack</h3>
                <p class="price">Rs.1200</p>
                <button class="buy-btn">Add to Cart</button>
            </div>
        </div>

    </main>

    <footer class="gallery-footer">
        <p>&copy; 2026 E-Commerce Store. All rights reserved.</p>
    </footer>

</body>
</html>
